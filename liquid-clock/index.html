<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>liquid clock</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#time{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:0;right:0;text-align:center;font-size:15px;letter-spacing:.12em;font-variant-numeric:tabular-nums;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
#panel{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;gap:10px;align-items:center;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .25s}
#panel.hide{transform:translateY(100%)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.row button{border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.25);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px}
.row button[aria-pressed=true]{background:#fff;color:#111;font-weight:700}
.sw{width:34px;height:34px;padding:0!important;border-radius:50%!important;border:2px solid rgba(255,255,255,.5)!important}
.sw[aria-pressed=true]{border:3px solid #fff!important;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
#tgl{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 6px);display:none;border:0;background:rgba(0,0,0,.4);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px}
#panel.hide ~ #tgl{display:block}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="time"></div>
<div id="panel">
 <div class="row" id="periods" role="group" aria-label="周期">
  <button data-p="60000" type="button">1分</button>
  <button data-p="3600000" type="button">1時間</button>
  <button data-p="43200000" type="button">12時間</button>
 </div>
 <div class="row" id="colors" role="group" aria-label="液体の色"></div>
 <div class="row"><button id="hide" type="button" style="font-size:12px;padding:5px 14px">設定を隠す</button></div>
</div>
<button id="tgl" type="button">設定</button>
<script>
"use strict";
var COLORS=[["青","#2f7bff"],["水色","#22d3ee"],["緑","#22c55e"],["紫","#a855f7"],["赤","#ef4444"],["橙","#f59e0b"],["桃","#ec4899"]];
var st={p:60000,c:0};
try{var s=JSON.parse(localStorage.getItem("liquid-clock")||"{}");
 if([60000,3600000,43200000].indexOf(s.p)>=0)st.p=s.p;
 if(s.c>=0&&s.c<COLORS.length)st.c=s.c|0;}catch(e){}
function save(){try{localStorage.setItem("liquid-clock",JSON.stringify(st));}catch(e){}}
var $=function(i){return document.getElementById(i);};
var cv=$("cv"),g=cv.getContext("2d"),W=0,H=0,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,3);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);}
addEventListener("resize",resize);resize();

// 周期内の位置(0〜1)を現在のローカル時刻から計算する。状態は持たないので、再表示しても時刻と一致する。
function fraction(now,p){
 var d=new Date(now);
 var ms=d.getMilliseconds(),s=d.getSeconds(),m=d.getMinutes(),h=d.getHours();
 if(p===60000)return (s*1000+ms)/60000;
 if(p===3600000)return ((m*60+s)*1000+ms)/3600000;
 return (((h%12)*3600+m*60+s)*1000+ms)/43200000;
}
function pad(n){return n<10?"0"+n:""+n;}
function shade(hex,k){var n=parseInt(hex.slice(1),16),r=n>>16,gg=n>>8&255,b=n&255;
 var f=function(v){return Math.max(0,Math.min(255,Math.round(k>=0?v+(255-v)*k:v*(1+k))));};
 return "rgb("+f(r)+","+f(gg)+","+f(b)+")";}

var off=document.createElement("canvas"),og=off.getContext("2d"),mask=document.createElement("canvas"),mg=mask.getContext("2d");
// 文字(時・分)を容器にして、その中だけを液体で満たす
function draw(){
 var now=Date.now(),f=fraction(now,st.p),t=now/1000,d=new Date(now);
 var hh=pad(d.getHours()),mm=pad(d.getMinutes());
 if(off.width!==cv.width||off.height!==cv.height){off.width=cv.width;off.height=cv.height;}
 if(mask.width!==cv.width||mask.height!==cv.height){mask.width=cv.width;mask.height=cv.height;}
 // 文字のサイズとレイアウト(縦画面向けに「時」の下に「分」を積む)
 var fam='900 100px system-ui,-apple-system,"Hiragino Sans",sans-serif';
 g.setTransform(dpr,0,0,dpr,0,0);g.font=fam;
 var w100=Math.max(g.measureText("00").width,g.measureText(hh).width,g.measureText(mm).width);
 var size=Math.min(100*W*0.84/w100,H*0.34),cap=size*0.73,gap=size*0.14;
 var fnt='900 '+size+'px system-ui,-apple-system,"Hiragino Sans",sans-serif';
 var blockH=cap*2+gap,top=H*0.47-blockH/2,y1=top+cap,y2=top+cap*2+gap,bot=y2;
 // 背景
 var bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#0b1020");bg.addColorStop(1,"#141b33");
 g.fillStyle=bg;g.fillRect(0,0,W,H);
 g.font=fnt;g.textAlign="center";g.textBaseline="alphabetic";
 // 空の容器(うっすら + 輪郭)
 g.fillStyle="rgba(255,255,255,0.07)";g.fillText(hh,W/2,y1);g.fillText(mm,W/2,y2);
 g.lineWidth=2;g.strokeStyle="rgba(255,255,255,0.55)";g.strokeText(hh,W/2,y1);g.strokeText(mm,W/2,y2);
 // 液体を offscreen に描き、最後に文字の形で切り抜く(destination-in)
 og.setTransform(dpr,0,0,dpr,0,0);og.globalCompositeOperation="source-over";og.clearRect(0,0,W,H);
 var amp=Math.min(size*0.05,12),base=top-amp*2+(bot-top+amp*4)*(1-f);
 var base0=COLORS[st.c][1];
 var layers=[{a:amp*0.7,k:0.03,sp:0.7,ph:1.3,k0:0.25,al:0.55},
             {a:amp*0.85,k:0.04,sp:-0.9,ph:3.1,k0:0.1,al:0.75},
             {a:amp,k:0.035,sp:0.6,ph:0,k0:0,al:1}];
 layers.forEach(function(L){
  og.beginPath();og.moveTo(0,H);
  for(var x=0;x<W+4;x+=4){x=Math.min(x,W);
   var y=base+Math.sin(x*L.k+t*L.sp*2+L.ph)*L.a+Math.sin(x*L.k*2.3-t*L.sp*1.4+L.ph)*L.a*0.35;
   og.lineTo(x,y);if(x>=W)break;}
  og.lineTo(W,H);og.closePath();
  var gr=og.createLinearGradient(0,top,0,bot);gr.addColorStop(0,shade(base0,L.k0));gr.addColorStop(1,shade(base0,L.k0-0.25));
  og.globalAlpha=L.al;og.fillStyle=gr;og.fill();});
 og.globalAlpha=1;
 og.globalCompositeOperation="destination-in";
 // 2つの文字列を一度に切り抜くため、まず別キャンバスに文字マスクを作る
 mg.setTransform(dpr,0,0,dpr,0,0);mg.clearRect(0,0,W,H);
 mg.font=fnt;mg.textAlign="center";mg.textBaseline="alphabetic";mg.fillStyle="#000";
 mg.fillText(hh,W/2,y1);mg.fillText(mm,W/2,y2);
 og.setTransform(1,0,0,1,0,0);og.drawImage(mask,0,0);
 og.globalCompositeOperation="source-over";
 g.setTransform(1,0,0,1,0,0);g.drawImage(off,0,0);g.setTransform(dpr,0,0,dpr,0,0);
 $("time").textContent=hh+":"+mm+":"+pad(d.getSeconds());
 requestAnimationFrame(draw);
}

function ui(){
 [].forEach.call($("periods").children,function(b){b.setAttribute("aria-pressed",String(+b.dataset.p===st.p));});
 [].forEach.call($("colors").children,function(b){b.setAttribute("aria-pressed",String(+b.dataset.i===st.c));});
}
COLORS.forEach(function(c,i){var b=document.createElement("button");b.type="button";b.className="sw";b.dataset.i=i;
 b.style.background=c[1];b.setAttribute("aria-label",c[0]);$("colors").appendChild(b);});
$("periods").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;st.p=+b.dataset.p;save();ui();});
$("colors").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;st.c=+b.dataset.i;save();ui();});
$("hide").addEventListener("click",function(){$("panel").classList.add("hide");});
$("tgl").addEventListener("click",function(){$("panel").classList.remove("hide");});
ui();draw();
window.__fraction=fraction;
</script>
</body>
</html>
