<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#34465A">
<title>究極の性格診断</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#F8F8F6;--panel:#FFFFFF;--ink:#252525;--sub:#777777;--main:#34465A;--sel:#E8EDF2;--line:#DCDCDC;--aux:#8B978B;--r:8px;--font:"Noto Serif JP","Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","游明朝","BIZ UDPMincho","MS PMincho","MS Mincho",serif}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.8}
.hidden{display:none!important}
button{font:inherit;font-size:15px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:11px 16px;cursor:pointer}
button.primary{background:var(--main);border-color:var(--main);color:#fff;font-weight:700}
button:disabled{opacity:.4;cursor:default}
body.start,body.quiz,body.analyzing{height:100dvh;overflow:hidden}
.screen{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}

/* ホーム */
.start-in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.start-in h1{font-family:var(--font);font-size:34px;font-weight:700;letter-spacing:.12em;margin:0 0 14px;color:var(--main)}
.start-in .desc{margin:0 0 44px;color:var(--sub);font-size:15px}
.start-in .primary{width:100%;max-width:300px;padding:15px;font-size:17px;letter-spacing:.1em}
.seedlink{background:none;border:0;color:var(--sub);font-size:12px;margin-top:34px;padding:6px 10px;text-decoration:underline}
.seedbox{display:flex;gap:8px;margin-top:6px;width:100%;max-width:300px}
.seedbox input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink)}

/* 診断 */
.qtop{display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px;font-size:13px;color:var(--sub)}
.qtop button{border:0;background:none;padding:6px 0;color:var(--main);font-size:14px}
.bar{height:3px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--main);transition:width .2s}
.qmain{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 0;min-height:0}
.q{font-size:20px;font-weight:700;line-height:1.75;margin:0 0 22px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;padding:13px 14px 13px 42px;position:relative;background:var(--panel);border:1px solid var(--line)}
.opt::before{content:"";position:absolute;left:14px;top:50%;width:14px;height:14px;margin-top:-7px;border:1px solid var(--aux);border-radius:50%}
.opt[aria-checked=true]{background:var(--sel);border-color:var(--main)}
.opt[aria-checked=true]::before{border-color:var(--main);background:radial-gradient(var(--main) 0 4px,transparent 5px)}
.qfoot{padding:10px 0 16px}
.qfoot .primary{width:100%;padding:14px}
.spin{flex:1;display:flex;align-items:center;justify-content:center;color:var(--sub)}

/* 結果 */
body.result{overflow:auto}
#result{max-width:560px;margin:0 auto;padding:0 20px calc(env(safe-area-inset-bottom) + 32px)}
.rhead{margin:0 -20px;padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;background:var(--main);color:#fff;text-align:center;font-family:var(--font);font-size:17px;letter-spacing:.3em}
.rtop{padding:26px 0 20px;border-bottom:1px solid var(--line);text-align:center}
.lab{font-size:12px;color:var(--sub);margin:0 0 4px;letter-spacing:.1em}
.typebox{overflow:hidden}
.res-type{font-family:var(--font);font-size:24px;font-weight:700;line-height:1.5;white-space:nowrap;display:inline-block;color:var(--main)}
.res-catch{font-size:14px;color:var(--sub);margin:4px 0 16px}
.sharebox{display:flex;gap:8px;justify-content:center}
.sharebox button{flex:1;max-width:200px;font-size:14px;padding:10px 8px;border-color:var(--main);color:var(--main)}
.sec{padding:20px 0 6px;border-bottom:1px solid var(--line)}
.sec h2{font-family:var(--font);font-size:17px;margin:0 0 10px;color:var(--main);padding-left:10px;border-left:3px solid var(--main);line-height:1.4}
.sec h3{font-size:13px;color:var(--sub);margin:12px 0 2px;font-weight:700}
.sec p{margin:0 0 10px;font-size:15px}
.sec ul{margin:0 0 10px;padding-left:1.3em;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:8px 0 10px;font-size:14px}
.kv dt{color:var(--sub);margin:0}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--sub);margin:16px 0}
.chart{display:block;width:100%;max-width:480px;margin:0 auto 6px}
.chart .grid{fill:none;stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .area{fill:var(--main);fill-opacity:.15;stroke:var(--main);stroke-width:2}
.chart .dot{fill:var(--main)}
.chart text{fill:var(--ink);font-size:17px;font-family:inherit}
.bars{margin:10px 0}
.bar2{margin:10px 0}
.bar2 .lab2{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:2px}
.bar2 .tr{height:6px;background:var(--line);margin-bottom:3px}
.bar2 .tr i{display:block;height:100%;background:var(--main)}
.bar2 .tr.b i{background:var(--aux)}
.actions{display:flex;flex-direction:column;gap:10px;margin:20px 0 14px}
.foot{font-size:12px;color:var(--sub)}
.foot summary{cursor:pointer}
.foot p{margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:var(--r);font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body class="start">
 <section id="start" class="screen">
  <div class="start-in">
   <h1>究極の性格診断</h1>
   <p class="desc">あなたの内面に関する傾向を測定します。</p>
   <button id="go" class="primary" type="button">診断を始める</button>
   <button id="seedLink" class="seedlink" type="button">シードで始める</button>
   <div id="seedBox" class="seedbox hidden">
    <input id="seed" type="text" autocomplete="off" spellcheck="false" maxlength="40" placeholder="シード" aria-label="シード">
    <button id="goSeed" type="button">開始</button>
   </div>
  </div>
 </section>

 <section id="quiz" class="screen hidden">
  <div class="qtop"><button id="back" type="button">← 戻る</button><span id="qnum"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="qmain"><p class="q" id="qtext"></p><div class="opts" id="opts" role="radiogroup"></div></div>
  <div class="qfoot"><button id="next" class="primary" type="button" disabled>次へ</button></div>
 </section>

 <section id="analyzing" class="screen hidden"><div class="spin" id="anaText">回答を集計しています</div></section>

 <section id="result" class="hidden"></section>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
"use strict";
// ===== 設定(ここを変えると挙動が変わる) =====
var CONFIG={
 questionCount:12,   // 1回の診断の設問数
 analyzeMs:1600,     // 「分析中」表示の長さ(ミリ秒)
 descCount:5,        // 解説文の数
 metricCount:6,      // スコア項目の数
 traitCount:3,       // 長所・短所の数(1つは両方に重複させる)
 jobCount:3,         // 向いている職業の数
 hobbyCount:3,       // 向いている趣味の数
 seedLength:8,       // 自動で作るシードの文字数
 maxPerGenre:3       // 1ジャンルから選ぶ設問の上限(ごちゃまぜ度を保つ)
};
var D=window.ABSURD_DATA;
var $=function(i){return document.getElementById(i);};

// ===== シード付き乱数(xmur3 → mulberry32) =====
function hashStr(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
 h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0;}
function makeRng(str){var a=hashStr(str);return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function int(r,n){return Math.floor(r()*n);}
function pick(r,a){return a[int(r,a.length)];}
function shuffle(r,a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=int(r,i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pickN(r,a,n){return shuffle(r,a).slice(0,Math.min(n,a.length));}
function newSeed(){var c="abcdefghjkmnpqrstuvwxyz23456789",s="";var u=new Uint32Array(CONFIG.seedLength);
 if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(u);else for(var k=0;k<u.length;k++)u[k]=Math.random()*1e9;
 for(var i=0;i<u.length;i++)s+=c[u[i]%c.length];return s;}

// ===== 設問の組み立て(シードだけで決まる) =====
function buildQuiz(seed){
 var r=makeRng("q|"+seed),all=[];
 Object.keys(D.GENRES).forEach(function(g){D.GENRES[g].forEach(function(t){all.push({g:g,t:t});});});
 var count={},out=[];
 shuffle(r,all).forEach(function(q){if(out.length>=CONFIG.questionCount)return;
  if((count[q.g]||0)>=CONFIG.maxPerGenre)return;count[q.g]=(count[q.g]||0)+1;out.push(q);});
 return out.map(function(q){var p=q.t.split("|");
  return {genre:q.g,text:p[0],opts:p.length>1?p.slice(1):pick(r,D.CHOICE_SETS)};});
}

// ===== 結果の組み立て(シードと回答で決まる) =====
function buildResult(seed,quiz,ans){
 var r=makeRng("r|"+seed+"|"+ans.join(""));
 function n(){return 1+int(r,99);}
 function typeName(){return pick(r,D.TYPE_ADJ)+pick(r,D.TYPE_NOUN);}
 var type=typeName();
 function fill(s){return s.replace(/\{n\}/g,function(){return n();}).replace(/\{m\}/g,function(){return 1+int(r,999);})
  .replace(/\{q\}/g,function(){return 1+int(r,quiz.length);}).replace(/\{t\}/g,function(){return type;})
  .replace(/\{x\}/g,function(){return pick(r,D.TRAITS);});}
 var L="ABCDEFGHJKLMNPQRSTUVWXYZ",code=[],codeMeaning=[];
 for(var i=0;i<4;i++){var ch=L[int(r,L.length)];code.push(ch);codeMeaning.push(ch+" … "+pick(r,D.CODE_MEANINGS));}
 var traits=pickN(r,D.TRAITS,CONFIG.traitCount*2),both=traits[0];
 var strengths=[both].concat(traits.slice(1,CONFIG.traitCount));
 var weak=shuffle(r,[both].concat(traits.slice(CONFIG.traitCount,CONFIG.traitCount*2-1)));
 var good=typeName(),bad=r()<.35?good:typeName();
 return {
  type:type,catchcopy:pick(r,D.CATCH),code:code.join("")+"-"+(1+int(r,9))+"型",codeMeaning:codeMeaning,
  rarity:fill(pick(r,D.RARITY)),
  radar:pickN(r,D.METRICS,6).map(function(m){return {name:m,v:int(r,101)};}),
  bars:pickN(r,D.PAIRS,3).map(function(p){return {a:p[0],b:p[1],va:int(r,101),vb:int(r,101)};}),
  metrics:pickN(r,D.METRICS,CONFIG.metricCount).map(function(m){return [m,fill(pick(r,D.METRIC_FORMATS))];}),
  desc:pickN(r,D.DESC,CONFIG.descCount).map(fill),
  strengths:strengths,weak:weak,
  good:pick(r,D.COMPAT_GOOD).replace("{t}",good),bad:fill(pick(r,D.COMPAT_BAD).replace("{t}",bad)),
  role:pick(r,D.ROLES),
  jobs:pickN(r,D.JOBS,CONFIG.jobCount),hobbies:pickN(r,D.HOBBIES,CONFIG.hobbyCount),
  future:fill(pick(r,D.FUTURE)),theme:pick(r,D.THEMES),motto:pick(r,D.MOTTOS),
  animal:pick(r,D.ANIMALS),color:pick(r,D.COLORS),
  item:pick(r,D.LUCKY_ITEMS),place:pick(r,D.LUCKY_PLACES),
  advice:fill(pick(r,D.ADVICE)),note:pick(r,D.DISCLAIMERS)
 };
}

// ===== 画面 =====
var st={seed:"",quiz:[],i:0,ans:[],fromUrl:false};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function cleanSeed(s){return String(s||"").trim().slice(0,40);}
function shareUrl(){var u=new URL(location.href);u.search="";u.hash="";u.searchParams.set("seed",st.seed);
 if(st.ans.length===st.quiz.length&&st.quiz.length)u.searchParams.set("a",st.ans.join(""));return u.toString();}
function setUrl(){try{history.replaceState(null,"",shareUrl());}catch(e){}}
function show(id){["start","quiz","analyzing","result"].forEach(function(k){$(k).classList.toggle("hidden",k!==id);});document.body.className=id;scrollTo(0,0);}
function toast(t){var el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("on");},1800);}

function startQuiz(seed){st.seed=cleanSeed(seed)||newSeed();st.quiz=buildQuiz(st.seed);st.i=0;st.ans=[];setUrl();renderQ();show("quiz");}
var sel=null;
function renderQ(){var q=st.quiz[st.i],tot=st.quiz.length;
 $("qnum").textContent="第"+(st.i+1)+"問 / 全"+tot+"問";
 $("prog").style.width=((st.i+1)/tot*100)+"%";$("qtext").textContent=q.text;
 sel=st.ans[st.i]===undefined?null:st.ans[st.i];
 var box=$("opts");box.innerHTML="";
 q.opts.forEach(function(o,idx){var b=document.createElement("button");b.type="button";b.className="opt";b.setAttribute("role","radio");b.textContent=o;
  b.onclick=function(){sel=idx;mark();};box.appendChild(b);});
 $("next").textContent=st.i===tot-1?"診断する":"次へ";mark();}
function mark(){Array.prototype.forEach.call($("opts").children,function(b,i){b.setAttribute("aria-checked",String(i===sel));});$("next").disabled=sel===null;}
function choose(idx){st.ans[st.i]=idx;st.ans.length=st.i+1;
 if(st.i<st.quiz.length-1){st.i++;renderQ();scrollTo(0,0);}else{setUrl();analyze();}}
function analyze(){show("analyzing");var msgs=["回答を集計しています","傾向を分析しています","タイプを判定しています"],k=0;
 $("anaText").textContent=msgs[0];var tm=setInterval(function(){k++;$("anaText").textContent=msgs[k%msgs.length];},Math.max(200,CONFIG.analyzeMs/msgs.length));
 setTimeout(function(){clearInterval(tm);renderResult();},CONFIG.analyzeMs);}
function li(a){return a.map(function(x){return "<li>"+esc(x)+"</li>";}).join("");}
function radarSvg(items){var W=480,H=320,cx=W/2,cy=H/2,R=95,n=items.length,svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="レーダーチャート">';
 function pt(i,k){var a=-Math.PI/2+2*Math.PI*i/n;return [cx+R*k*Math.cos(a),cy+R*k*Math.sin(a)];}
 function f(p){return p.map(function(x){return x.toFixed(1);}).join(",");}
 [.25,.5,.75,1].forEach(function(k){svg+='<polygon class="grid" points="'+items.map(function(_,i){return f(pt(i,k));}).join(" ")+'"/>';});
 items.forEach(function(it,i){var e=pt(i,1),l=pt(i,1.14);
  svg+='<line class="axis" x1="'+cx+'" y1="'+cy+'" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'"/>'+
  '<text x="'+l[0].toFixed(1)+'" y="'+(l[1]+4).toFixed(1)+'" text-anchor="'+(Math.abs(l[0]-cx)<8?"middle":l[0]>cx?"start":"end")+'">'+esc(it.name)+'</text>';});
 svg+='<polygon class="area" points="'+items.map(function(it,i){return f(pt(i,it.v/100));}).join(" ")+'"/>';
 items.forEach(function(it,i){var q=pt(i,it.v/100);svg+='<circle class="dot" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3"/>';});
 return svg+'</svg>';}
function barsHtml(a){return '<div class="bars">'+a.map(function(b){return '<div class="bar2"><div class="lab2"><span>'+esc(b.a)+' '+b.va+'%</span><span>'+esc(b.b)+' '+b.vb+'%</span></div>'+
 '<div class="tr"><i style="width:'+b.va+'%"></i></div><div class="tr b"><i style="width:'+b.vb+'%"></i></div></div>';}).join("")+'</div>';}
function fitType(){var box=document.querySelector(".typebox"),t=document.querySelector(".res-type");if(!box||!t)return;
 var size=24;t.style.fontSize=size+"px";while(t.scrollWidth>box.clientWidth&&size>12){size--;t.style.fontSize=size+"px";}}
function doCopy(){var u=shareUrl();(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){toast("URLをコピーしました");},function(){prompt("このURLをコピーしてください",u);});}
function doShare(R){if(navigator.share){navigator.share({title:"究極の性格診断",text:"私は「"+R.type+"」タイプでした",url:shareUrl()}).catch(function(){});}else doCopy();}
function renderResult(){var R=buildResult(st.seed,st.quiz,st.ans);var gs={},genres=[];st.quiz.forEach(function(q){if(!gs[q.genre]){gs[q.genre]=1;genres.push(q.genre);}});
 function sec(t,body){return '<section class="sec"><h2>'+t+'</h2>'+body+'</section>';}
 function kv(rows){return '<dl class="kv">'+rows.map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>';}).join("")+'</dl>';}
 $("result").innerHTML=
 '<div class="rhead"><span>診断結果</span></div><div class="rbody">'+
 '<div class="rtop"><p class="lab">あなたの診断タイプ</p><div class="typebox"><div class="res-type">「'+esc(R.type)+'」タイプ</div></div>'+
 '<p class="res-catch">'+esc(R.catchcopy)+'</p>'+
 '<div class="sharebox"><button type="button" id="copy">結果のURLをコピー</button><button type="button" id="nshare">共有する</button></div></div>'+
 sec("総合所見",R.desc.map(function(d){return "<p>"+esc(d)+"</p>";}).join(""))+
 sec("主な傾向",radarSvg(R.radar)+barsHtml(R.bars)+kv(R.metrics)+'<p class="note" style="margin-top:12px">タイプ記号:'+esc(R.code)+'('+esc(R.codeMeaning.join("、"))+')<br>'+esc(R.rarity)+'</p>')+
 sec("長所と短所",'<h3>長所</h3><ul>'+li(R.strengths)+'</ul><h3>短所</h3><ul>'+li(R.weak)+'</ul>')+
 sec("対人関係",'<p>'+esc(R.good)+'</p><p>'+esc(R.bad)+'</p>'+kv([["集団での役割",R.role]]))+
 sec("適性",'<h3>向いている職業</h3><ul>'+li(R.jobs)+'</ul><h3>向いている趣味</h3><ul>'+li(R.hobbies)+'</ul>')+
 sec("特記事項",kv([["10年後",R.future],["人生のテーマ",R.theme],["座右の銘",R.motto],["幸運の品",R.item],["幸運の方角",R.place],["幸運の色",R.color],["近い動物",R.animal]])+'<p style="margin-top:12px">'+esc(R.advice)+'</p>')+
 '<p class="note">'+esc(R.note)+' 本診断は娯楽を目的としたものであり、心理学的・医学的な根拠はありません。</p>'+
 '<div class="actions"><button type="button" class="primary" id="again">もう一度診断する</button><button type="button" id="home">ホームに戻る</button></div>'+
 '<details class="foot"><summary>この診断について</summary><p>この診断は、'+esc(genres.join("・"))+'などの診断を参考にした読み物です。</p>'+
 '<p>シード: '+esc(st.seed)+'(同じシードなら同じ質問になり、回答が同じなら同じ結果になります)</p></details></div>';
 show("result");fitType();
 $("copy").onclick=doCopy;$("nshare").onclick=function(){doShare(R);};
 function home(){$("seed").value="";st.fromUrl=false;try{history.replaceState(null,"",location.pathname);}catch(e){}show("start");}
 $("home").onclick=home;$("again").onclick=function(){startQuiz("");};
}
addEventListener("resize",function(){if(!$("result").classList.contains("hidden"))fitType();});

$("go").onclick=function(){startQuiz(st.fromUrl?$("seed").value:"");};
$("seedLink").onclick=function(){$("seedBox").classList.toggle("hidden");$("seed").focus();};
$("goSeed").onclick=function(){if(cleanSeed($("seed").value))startQuiz($("seed").value);};
$("seed").addEventListener("keydown",function(e){if(e.key==="Enter")$("goSeed").click();});
$("next").onclick=function(){if(sel!==null)choose(sel);};
$("back").onclick=function(){if(st.i>0){st.i--;renderQ();}else{show("start");}};
(function(){var qs=new URLSearchParams(location.search),seed=cleanSeed(qs.get("seed"));
 if(!seed)return;$("seed").value=seed;st.fromUrl=true;
 var a=qs.get("a");if(!a)return;
 var quiz=buildQuiz(seed);
 if(a.length===quiz.length&&a.split("").every(function(c,i){return /^[0-9]$/.test(c)&&+c<quiz[i].opts.length;})){
  st.seed=seed;st.quiz=quiz;st.ans=a.split("").map(Number);renderResult();}
})();
</script>
</body>
</html>
